<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>URL Shortener</title>
</head>
<body>
    <div class="container">
        <h2>Simple URL Shortener</h2>
        <div class="link_container">
            <label for="url" class="link_txt">Enter URL:</label>
            <input type="url" class="link" aria-required="true">
        </div>
        <button class="link_btn">Shorten URL</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
